import os
import subprocess

os.makedirs("output", exist_ok=True)

video_text = "অক্টোপাসের ৩টি হৃদপিণ্ড আছে!"

cmd = [
    "ffmpeg",
    "-y",
    "-f", "lavfi",
    "-i", "color=c=blue:s=1080x1920:d=8",
    "-vf",
    f"drawtext=text='{video_text}':fontcolor=white:fontsize=70:"
    "x=(w-text_w)/2:y=(h-text_h)/2",
    "-c:v", "libx264",
    "-pix_fmt", "yuv420p",
    "-movflags", "+faststart",
    "output/short.mp4"
]

subprocess.run(cmd, check=True)

print("Short video created successfully!")
