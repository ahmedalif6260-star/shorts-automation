name: Viral Shorts Automation

on:
  workflow_dispatch:

jobs:
  trending_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: |
          pip install requests

      - name: Get Trending Topic
        run: |
          python get_trending.py

      - name: Create Shorts Script
        run: |
          python make_script.py
